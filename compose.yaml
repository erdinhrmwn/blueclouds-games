# Local development services. Start with `docker compose up -d`.
# Ports bind to 127.0.0.1 only, so nothing is reachable from the network.
name: blueclouds-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/dev/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis-compatible store. Nothing uses it yet; it is here so local dev matches the plan.
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v1.40.2
    # Dragonfly needs at least 256 MiB per thread and refuses to start below that: 2 threads → 1 GB.
    command: ["--proactor_threads=2", "--maxmemory=1gb"]
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    # The image ships its own healthcheck.

volumes:
  postgres-data:
  dragonfly-data:
