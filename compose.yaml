name: blueclouds-dev

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-platform}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-platform}
      POSTGRES_DB: ${DATABASE_NAME:-platform}
      POSTGRES_TEST_DB: ${DATABASE_TEST_NAME:-platform_test}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/dev/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis-compatible. Not used yet.
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    restart: unless-stopped
    command: ["--proactor_threads=1", "--maxmemory=512mb"]
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1

volumes:
  postgres-data:
  dragonfly-data:
