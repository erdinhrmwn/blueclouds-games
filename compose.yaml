# Local dev services: `docker compose up -d`. Values come from the root .env (dev defaults below).
name: blueclouds-dev

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform}
      POSTGRES_TEST_DB: ${PLATFORM_TEST_DB_NAME:-platform_test}
    ports:
      - "127.0.0.1:${PLATFORM_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/dev/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

  # Redis-compatible. Not used yet.
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v1.40.2
    restart: unless-stopped
    # Needs at least 256 MiB per thread.
    command: ["--proactor_threads=1", "--maxmemory=512mb"]
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data

volumes:
  postgres-data:
  dragonfly-data:
